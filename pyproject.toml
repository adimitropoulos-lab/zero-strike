[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-strike"
version = "0.1.0"
description = "Polymarket information-asymmetry agent: trader-edge mining, news mapping, arbitrage, Kelly sizing."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "tenacity>=8.2",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
live = ["py-clob-client>=0.17", "eth-account>=0.11"]

[project.scripts]
zero-strike = "zero_strike.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
